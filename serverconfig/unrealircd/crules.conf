/* Config for crule function tests (tests/crules/).
 * Most functions are tested via VHOST: each vhost block has a
 * match { rule "..."; } that is evaluated when the test sends
 * VHOST <login> <password>. Match = vhost applied, no match = denied.
 * Functions that need context->text or context->destination (such as
 * text analysis and channel-targeting functions) cannot be tested via
 * VHOST and use spamfilter blocks instead.
 */

vhost { vhost "crule_is_oper"; login "crule_is_oper"; password "test";
        match { rule "is_oper()"; } }

vhost { vhost "crule_is_away"; login "crule_is_away"; password "test";
        match { rule "is_away()"; } }

vhost { vhost "crule_is_local"; login "crule_is_local"; password "test";
        match { rule "is_local()"; } }

vhost { vhost "crule_match_server"; login "crule_match_server"; password "test";
        match { rule "match_server('irc1.test.net')"; } }

vhost { vhost "crule_in_channel"; login "crule_in_channel"; password "test";
        match { rule "in_channel('#cruletest')"; } }

vhost { vhost "crule_channel_count"; login "crule_channel_count"; password "test";
        match { rule "channel_count() > 1"; } }

vhost { vhost "crule_reputation"; login "crule_reputation"; password "test";
        match { rule "reputation() > 100"; } }

vhost { vhost "crule_logic"; login "crule_logic"; password "test";
        match { rule "is_local() && !is_oper()"; } }

vhost { vhost "crule_has_user_mode"; login "crule_has_user_mode"; password "test";
        match { rule "has_user_mode('w')"; } }

vhost { vhost "crule_match_class"; login "crule_match_class"; password "test";
        match { rule "match_class('clients')"; } }

vhost { vhost "crule_match_realname"; login "crule_match_realname"; password "test";
        match { rule "match_realname('*Test*')"; } }

vhost { vhost "crule_match_ip"; login "crule_match_ip"; password "test";
        match { rule "match_ip('127.0.0.*')"; } }

vhost { vhost "crule_match_away"; login "crule_match_away"; password "test";
        match { rule "match_away('*busy*')"; } }

vhost { vhost "crule_match_operlogin"; login "crule_match_operlogin"; password "test";
        match { rule "match_operlogin('netadmin')"; } }

vhost { vhost "crule_match_operclass"; login "crule_match_operclass"; password "test";
        match { rule "match_operclass('netadmin*')"; } }

vhost { vhost "crule_server_port"; login "crule_server_port"; password "test";
        match { rule "server_port() == 5661"; } }

vhost { vhost "crule_connections_from_ip"; login "crule_connections_from_ip"; password "test";
        match { rule "connections_from_ip() > 0"; } }

vhost { vhost "crule_has_swhois"; login "crule_has_swhois"; password "test";
        match { rule "has_swhois()"; } }

vhost { vhost "crule_online_time"; login "crule_online_time"; password "test";
        match { rule "online_time() < 300"; } }

vhost { vhost "crule_match_mask"; login "crule_match_mask"; password "test";
        match { rule "match_mask('*!username@127.0.0.*')"; } }

vhost { vhost "crule_match_realhost"; login "crule_match_realhost"; password "test";
        match { rule "match_realhost('localhost')"; } }

vhost { vhost "crule_match_vhost"; login "crule_match_vhost"; password "test";
        match { rule "match_vhost('crule_*')"; } }

vhost { vhost "crule_idle_time"; login "crule_idle_time"; password "test";
        match { rule "idle_time() < 300"; } }

vhost { vhost "crule_connected"; login "crule_connected"; password "test";
        match { rule "connected('irc*.test.net')"; } }

vhost { vhost "crule_connected_neg"; login "crule_connected_neg"; password "test";
        match { rule "connected('nonexistent.*')"; } }

vhost { vhost "crule_directcon"; login "crule_directcon"; password "test";
        match { rule "directcon('irc2.test.net')"; } }

vhost { vhost "crule_directop"; login "crule_directop"; password "test";
        match { rule "directop()"; } }

vhost { vhost "crule_messages_sent"; login "crule_messages_sent"; password "test";
        match { rule "messages_sent() > 0"; } }

vhost { vhost "crule_messages_received"; login "crule_messages_received"; password "test";
        match { rule "messages_received() > 0"; } }

vhost { vhost "crule_cap_set"; login "crule_cap_set"; password "test";
        match { rule "cap_set('message-tags')"; } }

vhost { vhost "crule_cap_version"; login "crule_cap_version"; password "test";
        match { rule "cap_version() < 302"; } }

vhost { vhost "crule_in_security_group"; login "crule_in_security_group"; password "test";
        match { rule "in_security_group('unknown-users')"; } }

vhost { vhost "crule_bytes_sent"; login "crule_bytes_sent"; password "test";
        match { rule "bytes_sent() > 1500"; } }

vhost { vhost "crule_bytes_received"; login "crule_bytes_received"; password "test";
        match { rule "bytes_received() > 5000"; } }

/* Services-dependent crule tests (tests/services/) */

vhost { vhost "crule_is_identified"; login "crule_is_identified"; password "test";
        match { rule "is_identified()"; } }

vhost { vhost "crule_is_identified_neg"; login "crule_is_identified_neg"; password "test";
        match { rule "!is_identified()"; } }

vhost { vhost "crule_match_account"; login "crule_match_account"; password "test";
        match { rule "match_account('client1')"; } }

vhost { vhost "crule_match_account_neg"; login "crule_match_account_neg"; password "test";
        match { rule "match_account('nonexistent')"; } }

/* Negative test vhost blocks: these rules should NOT match for test clients */

vhost { vhost "crule_cap_set_neg"; login "crule_cap_set_neg"; password "test";
        match { rule "cap_set('batch')"; } }

vhost { vhost "crule_cap_version_neg"; login "crule_cap_version_neg"; password "test";
        match { rule "cap_version() > 999"; } }

vhost { vhost "crule_connections_from_ip_neg"; login "crule_connections_from_ip_neg"; password "test";
        match { rule "connections_from_ip() > 99999"; } }

vhost { vhost "crule_directcon_neg"; login "crule_directcon_neg"; password "test";
        match { rule "directcon('irc3.test.net')"; } }

vhost { vhost "crule_idle_time_neg"; login "crule_idle_time_neg"; password "test";
        match { rule "idle_time() > 99999"; } }

vhost { vhost "crule_in_security_group_neg"; login "crule_in_security_group_neg"; password "test";
        match { rule "in_security_group('known-users')"; } }

vhost { vhost "crule_match_class_neg"; login "crule_match_class_neg"; password "test";
        match { rule "match_class('opers')"; } }

vhost { vhost "crule_match_ip_neg"; login "crule_match_ip_neg"; password "test";
        match { rule "match_ip('192.168.*')"; } }

vhost { vhost "crule_match_mask_neg"; login "crule_match_mask_neg"; password "test";
        match { rule "match_mask('*!nobody@10.*')"; } }

vhost { vhost "crule_match_realhost_neg"; login "crule_match_realhost_neg"; password "test";
        match { rule "match_realhost('example.com')"; } }

vhost { vhost "crule_match_realname_neg"; login "crule_match_realname_neg"; password "test";
        match { rule "match_realname('*Production*')"; } }

vhost { vhost "crule_messages_received_neg"; login "crule_messages_received_neg"; password "test";
        match { rule "messages_received() > 99999"; } }

vhost { vhost "crule_messages_sent_neg"; login "crule_messages_sent_neg"; password "test";
        match { rule "messages_sent() > 99999"; } }

vhost { vhost "crule_online_time_neg"; login "crule_online_time_neg"; password "test";
        match { rule "online_time() > 99999"; } }

spamfilter {
    match-type regex;
    match "crule_uppercase_percentage .*";
    rule "uppercase_percentage() > 80";
    target private;
    action block;
    reason "crule_uppercase_percentage";
}

spamfilter {
    match-type regex;
    match "crule_word_count .*";
    rule "word_count() > 5";
    target private;
    action block;
    reason "crule_word_count";
}

spamfilter {
    match-type regex;
    match "crule_text_byte_count .*";
    rule "text_byte_count() > 50";
    target private;
    action block;
    reason "crule_text_byte_count";
}

spamfilter {
    match-type regex;
    match "crule_max_repeat_count .*";
    rule "max_repeat_count() > 4";
    target private;
    action block;
    reason "crule_max_repeat_count";
}

spamfilter {
    match-type regex;
    match "crule_digit_percentage .*";
    rule "digit_percentage() > 60";
    target private;
    action block;
    reason "crule_digit_percentage";
}

spamfilter {
    match-type regex;
    match "crule_has_channel_mode .*";
    rule "has_channel_mode('m')";
    target channel;
    action block;
    reason "crule_has_channel_mode";
}

spamfilter {
    match-type regex;
    match "crule_channel_member_count .*";
    rule "channel_member_count() > 1";
    target channel;
    action block;
    reason "crule_channel_member_count";
}

spamfilter {
    match-type regex;
    match "crule_destination .*";
    rule "destination('#cruletest*')";
    target { private; channel; };
    action block;
    reason "crule_destination";
}

spamfilter {
    match-type regex;
    match "crule_text_character_count .*";
    rule "text_character_count() > 50";
    target private;
    action block;
    reason "crule_text_character_count";
}

spamfilter {
    match-type regex;
    match "crule_non_ascii_percentage .*";
    rule "non_ascii_percentage() > 50";
    target private;
    action block;
    reason "crule_non_ascii_percentage";
}

spamfilter {
    match-type regex;
    match "crule_unicode_block_count .*";
    rule "unicode_block_count() > 1";
    target private;
    action block;
    reason "crule_unicode_block_count";
}

spamfilter {
    match-type regex;
    match "crule_mixed_utf8_score .*";
    rule "mixed_utf8_score() > 0";
    target private;
    action block;
    reason "crule_mixed_utf8_score";
}

spamfilter {
    match-type regex;
    match "crule_unicode_count .*";
    rule "unicode_count('Cyrillic') > 0";
    target private;
    action block;
    reason "crule_unicode_count";
}

spamfilter {
    match-type regex;
    match "crule_tag_set .*";
    target private;
    action { set CRULE_TESTTAG=1; };
    reason "crule_tag_set";
}

spamfilter {
    match-type regex;
    match "crule_tag_check .*";
    rule "tag('CRULE_TESTTAG') > 0";
    target private;
    action block;
    reason "crule_tag_check";
}
